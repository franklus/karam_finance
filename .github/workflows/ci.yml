name: Karam Finance CI

on:
  push:
    branches: [version-16]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: karam-finance-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Frappe v16 server
    runs-on: ubuntu-latest
    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Enable Yarn
        run: corepack enable

      - name: Install MariaDB client and Bench
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client
          python -m pip install frappe-bench==5.31.0

      - name: Initialise Frappe v16 Bench
        run: >-
          bench init
          --frappe-branch version-16
          --skip-redis-config-generation
          --skip-assets
          --python "$(command -v python)"
          /home/runner/frappe-bench

      - name: Configure database
        run: |
          mariadb --host 127.0.0.1 --port 3306 --user root --password=root \
            --execute "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 --user root --password=root \
            --execute "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install ERPNext and application
        working-directory: /home/runner/frappe-bench
        env:
          CI: "Yes"
        run: |
          # ERPNext's recursive test fixtures include Payment Gateway.
          bench get-app --branch version-16 https://github.com/frappe/payments.git
          bench get-app --branch version-16 https://github.com/frappe/erpnext.git
          bench get-app karam_finance "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          ./env/bin/python -m pip install pytest==9.1.1
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site set-config allow_tests true
          bench --site test_site install-app payments
          bench --site test_site install-app erpnext
          bench --site test_site install-app karam_finance
          bench --site test_site migrate
          bench new-site --db-root-password root --admin-password admin karam-finance-test.local
          bench --site karam-finance-test.local set-config allow_tests true
          bench --site karam-finance-test.local install-app payments
          bench --site karam-finance-test.local install-app erpnext
          bench --site karam-finance-test.local install-app karam_finance
          bench --site karam-finance-test.local migrate
          bench --site karam-finance-test.local set-config karam_finance_disposable_test_site true
          bench --site karam-finance-test.local scheduler disable
          bench build --app karam_finance

      - name: Verify installed dependencies
        id: dependencies
        working-directory: /home/runner/frappe-bench
        run: ./env/bin/python -m pip check

      - name: Run Pyrefly in the Bench environment
        working-directory: /home/runner/frappe-bench/apps/karam_finance
        run: bash tools/run_pyrefly.sh

      - name: Run server tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: /home/runner/frappe-bench/sites
        env:
          TYPE: server
          COVERAGE_RCFILE: /home/runner/frappe-bench/apps/karam_finance/pyproject.toml
        # Measure directly: Frappe's --coverage wrapper excludes patches.
        run: >-
          ../env/bin/python -m coverage run
          -m frappe.utils.bench_helper frappe
          --site test_site run-tests --app karam_finance

      # Frappe's unittest discovery does not collect pytest functions or plain classes.
      - name: Run pytest tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: /home/runner/frappe-bench/sites
        env:
          FRAPPE_STREAM_LOGGING: "1"
          COVERAGE_RCFILE: /home/runner/frappe-bench/apps/karam_finance/pyproject.toml
        run: >-
          ../env/bin/python -m coverage run --append -m pytest -q
          ../apps/karam_finance/karam_finance/karam_general/tests/test_schema_integrity.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_trial_balance_report.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_karam_gl_query_contracts.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_gl_enrichment_contracts.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_gl_filter_contracts.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_gl_aggregation_contracts.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_gl_execution_contracts.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_gl_currency_context_contracts.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_pnlcc_contracts.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_brs_contracts.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_bank_clearance_contracts.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_asset_depreciation_contracts.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_item_price_helper_contracts.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_tbk_contracts.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_tbk_row_contracts.py
          ../apps/karam_finance/karam_finance/karam_general/tests/test_tbfp_contracts.py
          ../apps/karam_finance/karam_finance/reporting_currency/tests/test_reporting_gl_query_contracts.py
          ../apps/karam_finance/karam_finance/reporting_currency/tests/test_party_reporting_query.py
          ../apps/karam_finance/karam_finance/reporting_currency/tests/test_trial_balance_for_party_reporting.py
          ../apps/karam_finance/karam_finance/reporting_currency/tests/test_reporting_tb_contracts.py
          ../apps/karam_finance/karam_finance/reporting_currency/tests/test_reporting_tb_filter_row_contracts.py
          ../apps/karam_finance/karam_finance/reporting_currency/tests/test_reporting_tbfp_contracts.py
          ../apps/karam_finance/karam_finance/reporting_currency/doctype/reporting_currency_gle/sync/test_doe_party_port.py
          ../apps/karam_finance/karam_finance/reporting_currency/doctype/reporting_currency_gle/sync/test_doe_metadata_repair.py
          ../apps/karam_finance/karam_finance/reporting_currency/doctype/reporting_currency_gle/sync/test_sync_contracts.py
          ../apps/karam_finance/karam_finance/reporting_currency/doctype/reporting_currency_gle/sync/test_sync_support_contracts.py
          ../apps/karam_finance/karam_finance/reporting_currency/doctype/reporting_currency_gle/sync/test_sync_status_contracts.py
          ../apps/karam_finance/karam_finance/reporting_currency/doctype/reporting_currency_gle/sync/test_doe_support_contracts.py
          ../apps/karam_finance/karam_finance/common/tests/test_common_contracts.py
          ../apps/karam_finance/karam_finance/common/tests/test_tiny_controller_contracts.py
          ../apps/karam_finance/karam_finance/patches/test_fix_merged_gl_entries.py
          ../apps/karam_finance/karam_finance/patches/test_delete_stale_general_ledger_reporting_currency_report.py
          ../apps/karam_finance/karam_finance/patches/test_delete_stale_trial_balance_reporting_report.py
          ../apps/karam_finance/karam_finance/patches/test_disable_general_ledger_karam_auto_total.py
          ../apps/karam_finance/karam_finance/tests/test_migrate_contracts.py
          ../apps/karam_finance/karam_finance/tests/test_site_safety.py
          ../apps/karam_finance/karam_finance/karam_series/tests/test_hooks.py
          ../apps/karam_finance/karam_finance/karam_series/tests/test_doctype_list_sync.py
          ../apps/karam_finance/karam_finance/karam_series/tests/test_settings_and_custom_fields.py
          ../apps/karam_finance/karam_finance/karam_series/tests/test_controllers.py
          ../apps/karam_finance/karam_finance/letter_reconciliation/doctype/letter_reconciliation/test_letter_row_links.py
          ../apps/karam_finance/karam_finance/letter_reconciliation/doctype/letter_reconciliation/test_reconciliation_contracts.py
          ../apps/karam_finance/karam_finance/letter_reconciliation/doctype/letter_reconciliation_settings/test_rebuild_contracts.py
          ../apps/karam_finance/karam_finance/letter_reconciliation/tests/test_doc_event_contracts.py
          ../apps/karam_finance/karam_finance/letter_reconciliation/tests/test_lettering_contracts.py
          ../apps/karam_finance/karam_finance/letter_reconciliation/tests/test_rebuild_support_contracts.py

      - name: Run isolated finance review integration tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: /home/runner/frappe-bench/sites
        env:
          COVERAGE_RCFILE: /home/runner/frappe-bench/apps/karam_finance/pyproject.toml
        run: |
          ../env/bin/python -m coverage run --append -m frappe.utils.bench_helper frappe \
            --site karam-finance-test.local run-tests \
            --module karam_finance.tests.finance_review_locking
          ../env/bin/python -m coverage run --append -m frappe.utils.bench_helper frappe \
            --site karam-finance-test.local run-tests \
            --module karam_finance.tests.finance_review_currency_change

      - name: Enforce separate line and branch coverage thresholds
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: /home/runner/frappe-bench/sites
        env:
          COVERAGE_RCFILE: /home/runner/frappe-bench/apps/karam_finance/pyproject.toml
        run: |
          ../env/bin/python -m coverage json -o coverage.json --fail-under=0
          ../env/bin/python -m coverage report --show-missing --sort=cover --fail-under=0
          ../env/bin/python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("coverage.json").read_text())
          totals = report["totals"]
          if not report["meta"]["branch_coverage"]:
              raise SystemExit("Branch coverage was not measured")
          failures = []
          for label, covered, total in (
              ("Line", totals["covered_lines"], totals["num_statements"]),
              ("Branch", totals["covered_branches"], totals["num_branches"]),
          ):
              if total <= 0:
                  raise SystemExit(f"No {label.lower()} coverage data")
              percentage = covered / total * 100
              print(f"{label} coverage: {percentage:.2f}% (required: 98%)")
              if covered * 100 < total * 98:
                  failures.append(f"{label} coverage is below 98%")
          if failures:
              raise SystemExit("; ".join(failures))
          PY

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: server-coverage
          path: /home/runner/frappe-bench/sites/coverage.json
          if-no-files-found: error

name: Quality

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install quality tools
        run: python -m pip install pre-commit==4.6.1

      - name: Install JavaScript tools
        run: npm ci --ignore-scripts

      - name: Run pre-commit
        env:
          SKIP: pyrefly
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run JavaScript tests
        run: npm run test:js

  security:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Semgrep
        run: python -m pip install semgrep==1.172.0

      - name: Checkout extended Frappe rules
        uses: actions/checkout@v6
        with:
          repository: vatsyy/frappe-semgrep-rules-extended
          ref: 24b6f6df8cbb57e599c92e88300c9bc8c66a4ffa
          path: .frappe-semgrep-rules-extended

      - name: Run Semgrep
        run: >-
          semgrep scan --error
          --config semgrep.yml
          --config .frappe-semgrep-rules-extended/rules
          --config r/python.lang.correctness
          karam_finance

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Audit application dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --desc on .

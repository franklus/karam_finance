exclude: ^(node_modules/|karam_finance/public/dist/)
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: ^karam_finance/.*\.json$
      - id: trailing-whitespace
        exclude: ^karam_finance/.*\.(json|md|svg|txt)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: ["."]
        pass_filenames: false
        always_run: true
      - id: ruff-format
        args: [--check, "."]
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: cognitive-complexity
        name: Python cognitive complexity
        entry: complexipy --failed
        language: python
        additional_dependencies: [complexipy==8.0.0]
        pass_filenames: false
        always_run: true

      - id: module-size
        name: Python physical module size
        entry: pylint --rcfile=pyproject.toml karam_finance tools
        language: python
        additional_dependencies: [pylint==4.0.8]
        pass_filenames: false
        always_run: true

      - id: vulture
        name: Unused Python code candidates
        entry: vulture
        language: python
        additional_dependencies: [vulture==2.16]
        pass_filenames: false
        always_run: true

      - id: pyrefly
        name: pyrefly
        entry: bash tools/run_pyrefly.sh
        language: system
        pass_filenames: false
        types: [python]
        always_run: true

      - id: eslint
        name: eslint
        entry: npm run lint:js --
        language: system
        pass_filenames: false
        files: \.(js|mjs|cjs)$
        always_run: true

      - id: prettier
        name: prettier
        entry: npm run format:check --
        language: system
        pass_filenames: false
        files: \.(js|css|scss|vue)$
        always_run: true

ci:
  autoupdate_schedule: weekly
  skip: [pyrefly, eslint, prettier]
  submodules: false

exclude: ^(node_modules/|karam_finance/public/dist/)
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: ^karam_finance/.*\.json$
      - id: trailing-whitespace
        exclude: ^karam_finance/.*\.(json|md|svg|txt)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
        stages: [manual]

  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        entry: bash tools/run_pyrefly.sh
        language: system
        pass_filenames: false
        types: [python]

      - id: eslint
        name: eslint
        entry: npm run lint:js --
        language: system
        pass_filenames: false
        files: \.(js|mjs|cjs)$

      - id: prettier
        name: prettier
        entry: npm run format:check --
        language: system
        pass_filenames: false
        files: \.(js|css|scss|vue)$
        stages: [manual]

ci:
  autoupdate_schedule: weekly
  skip: [pyrefly, eslint, prettier]
  submodules: false

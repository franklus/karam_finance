[project]
name = "karam_finance"
authors = [
    { name = "Noospheric", email = "repast_pesos42@icloud.com"}
]
description = "Karam-specific finance, reconciliation, reporting, numbering, and operational controls for ERPNext."
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
complexipy = "==8.0.0"
coverage = "==7.15.4"
pylint = "==4.0.8"
pyrefly = "==1.2.0"
ruff = "==0.16.2"
vulture = "==2.16"

[dependency-groups]
dev = [
    "complexipy==8.0.0",
    "coverage==7.15.4",
    "pylint==4.0.8",
    "pyrefly==1.2.0",
    "ruff==0.16.2",
    "vulture==2.16",
]

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 88
target-version = "py314"
required-version = "==0.16.2"
src = ["karam_finance"]
show-fixes = true
extend-exclude = [
    "*.json",
    "node_modules/",
    "karam_finance/public/dist/",
]

[tool.ruff.lint]
# Vulture uses local V-codes for reviewed dynamic registration and compatibility APIs.
external = ["V101", "V102", "V103", "V104", "V105", "V107"]
# Opt into only named preview rules; keep formatter behaviour stable.
preview = true
explicit-preview-rules = true
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "DTZ",
    "E",
    "ERA",
    "EXE",
    "F",
    "FLY",
    "FURB",
    "G",
    "I",
    "INT",
    "LOG",
    "PERF",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "PT022",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TRY",
    "UP",
    "W",
    "YTT",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR1702",
]
ignore = [
    # Formatting owns wrapping; long URLs and SQL literals are not lint debt.
    "E501",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 7
max-positional-args = 3
max-nested-blocks = 3
max-returns = 6
max-statements = 35

[tool.ruff.lint.flake8-builtins]
strict-checking = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# Assertions and dummy credentials are intentional in tests. Structural checks
# remain active; any further exception must be local and justified.
"**/tests/**/*.py" = ["S101", "S105"]
"**/test_*.py" = ["S101", "S105"]

[tool.complexipy]
paths = ["karam_finance", "tools"]
max-complexity-allowed = 10
snapshot-ignore = true
ignore-complexity = false
no-ignore = true

# Pylint supplies only the physical module-size check; Ruff owns linting.
[tool.pylint.main]
recursive = true
persistent = false

[tool.pylint.messages_control]
disable = ["all"]
enable = ["too-many-lines"]

[tool.pylint.format]
max-module-lines = 1000

[tool.pylint.reports]
score = false

[tool.vulture]
paths = ["karam_finance", "tools"]
# Include lower-confidence candidates for review. Frappe's dynamic registration
# can produce false positives; verify each before adding a specific whitelist.
min_confidence = 60
sort_by_size = true

[tool.coverage.run]
branch = true
source = ["karam_finance"]

[tool.coverage.report]
fail_under = 98
precision = 2
show_missing = true
skip_empty = true
omit = ["*/tests/*", "*/test_*.py"]
# Do not exclude defensive branches or exceptions from delivery coverage.
exclude_lines = ["if TYPE_CHECKING:"]

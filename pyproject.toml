[project]
name = "karam_finance"
authors = [
    { name = "Noospheric", email = "repast_pesos42@icloud.com"}
]
description = "Karam-specific finance, reconciliation, reporting, numbering, and operational controls for ERPNext."
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
pyrefly = "==1.2.0"
ruff = ">=0.16.2,<0.17"

[dependency-groups]
dev = [
    "pyrefly==1.2.0",
    "ruff>=0.16.2,<0.17",
]

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 88
target-version = "py314"
required-version = ">=0.16.2,<0.17"
src = ["karam_finance"]
show-fixes = true
extend-exclude = [
    "*.json",
    "node_modules/",
    "karam_finance/public/dist/",
]

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "DTZ",
    "E",
    "ERA",
    "EXE",
    "F",
    "FLY",
    "FURB",
    "G",
    "I",
    "INT",
    "LOG",
    "PERF",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "PT022",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TRY",
    "UP",
    "W",
    "YTT",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
]
ignore = [
    # Deferred existing debt; adopt each rule after its current findings are fixed.
    "ARG001",
    "BLE001",
    "C420",
    "DTZ011",
    "E501",
    "FURB162",
    "PLC0415",
    "PT022",
    "RET504",
    "RUF100",
    "SIM102",
    "TRY003",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.mccabe]
max-complexity = 19

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 18
max-positional-args = 11
max-returns = 6
max-statements = 70

[tool.ruff.lint.flake8-builtins]
strict-checking = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "S105", "PLR0915"]
"**/test_*.py" = ["S101", "S105", "PLR0915"]
